<!--caseno-start--><script>
(function(){
/* 資料の案件番号(正本)。案件番号を入れる.py で各HTMLに埋め込む(目印 caseno-start/end)。秘書のサーバーも、開くときに自動で入れる。
   <meta name="secretary-case" content="B21"> の番号を、タイトル(最初の h1)のすぐ上に大きく出す。タブの題名の頭にも付ける。
   番号は 英字1つ+数字(A1〜Y99)。テンプレートの A0 など番号でないものは出さない。
   自分で書いた <div class="sec-caseno"> があれば、そちらを使って何もしない。 */
if(window.__caseno)return;window.__caseno=1;
function run(){
 var m=document.querySelector('meta[name="secretary-case"]'),c=m?(m.getAttribute('content')||'').trim().toUpperCase():'';
 if(!/^[A-Z][1-9][0-9]?$/.test(c)||document.querySelector('.sec-caseno'))return;
 var st=document.createElement('style');
 st.textContent='.sec-caseno{display:inline-flex;align-items:baseline;gap:8px;margin:4px 0 8px;padding:4px 16px 6px;border-radius:12px;'+
  'background:#ffb454;color:#1b2030;font-weight:800;line-height:1.1;box-shadow:0 2px 8px rgba(0,0,0,.35)}'+
  '.sec-caseno .sec-caseno-l{font-size:15px;font-weight:700}.sec-caseno .sec-caseno-c{font-size:34px;letter-spacing:.04em}';
 (document.head||document.body).appendChild(st);
 var b=document.createElement('div');b.className='sec-caseno';b.title='この資料の案件番号';
 var l=document.createElement('span');l.className='sec-caseno-l';l.textContent='案件';
 var n=document.createElement('span');n.className='sec-caseno-c';n.textContent=c;
 b.appendChild(l);b.appendChild(n);
 var h=document.querySelector('h1');
 if(h&&h.parentNode)h.parentNode.insertBefore(b,h);
 else{var f=document.body.firstElementChild;while(f&&/^(SCRIPT|STYLE)$/.test(f.tagName))f=f.nextElementSibling;
  (f&&f.firstChild?f:document.body).insertBefore(b,(f&&f.firstChild)||document.body.firstChild)}
 if(document.title&&document.title.indexOf(c)!==0)document.title=c+' '+document.title;
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();
</script><!--caseno-end-->
</body>
